# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Optional: this file lets Render create the whole stack from scratch
# (Dashboard -> New -> Blueprint). If you already created the service by hand,
# Render ignores this file and you configure the same values in the Dashboard.
#
# Region, plan and instance names below are examples — adjust to taste.

services:
  - type: web
    name: acada-cooperative-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    healthCheckPath: /health/
    # collectstatic runs at build time so the manifest WhiteNoise needs exists
    # before the first request. Migrations run at start-up because the build
    # container has no guaranteed network access to the database.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash seed_on_first_deploy.sh
    envVars:
      - key: DJANGO_ENV
        value: prod
      # Generated once by Render and never committed to the repo.
      - key: SECRET_KEY
        generateValue: true
      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS are derived from
      # RENDER_EXTERNAL_HOSTNAME by config/settings/prod.py. Only set them for
      # custom domains:
      #   ALLOWED_HOSTS=api.example.com
      #   CSRF_TRUSTED_ORIGINS=https://api.example.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: acada-cooperative-db
          property: connectionString
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"

databases:
  - name: acada-cooperative-db
    databaseName: coop_db
    user: coop_user
    plan: free
    region: frankfurt